services:
  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "36379:6379"
    healthcheck:
      test: [ "CMD", "valkey-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 12

  postgres:
    image: postgres:17-alpine
    ports:
      - "35432:5432"
    environment:
      POSTGRES_DB: test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U test -d test" ]
      interval: 5s
      timeout: 5s
      retries: 12

  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    ports:
      - "31521:1521"
    environment:
      ORACLE_PASSWORD: test
      APP_USER: test
      APP_USER_PASSWORD: test
    healthcheck:
      test: [ "CMD", "healthcheck.sh" ]
      interval: 10s
      timeout: 5s
      retries: 12
