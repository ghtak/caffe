[package]
name = "espr"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
axum-server = { version = "0.9.2", features = ["tls-rustls-ring"] }
config = "0.15.27"
opentelemetry = "0.33.1"
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["grpc-tonic", "trace"] }
opentelemetry_sdk = "0.33.1"
rcgen = "0.14.10"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["fs"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-opentelemetry = "0.34.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
opentelemetry-proto = { version = "0.33.1", default-features = false, features = ["gen-tonic", "trace"] }
tokio-stream = { version = "0.1.19", features = ["net"] }
tonic = { version = "0.14.9", features = ["transport"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["trace"] }
