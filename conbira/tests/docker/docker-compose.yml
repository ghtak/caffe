services:
  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "26379:6379"
    healthcheck:
      test: [ "CMD", "valkey-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 12

  postgres:
    image: postgres:17-alpine
    ports:
      - "25432:5432"
    environment:
      POSTGRES_DB: conbira
      POSTGRES_USER: conbira
      POSTGRES_PASSWORD: conbira
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U conbira -d conbira" ]
      interval: 5s
      timeout: 5s
      retries: 12
