[trace.console]
filter = "trace"
ansi = true

[trace.file]
filter = "trace"
directory = "var/log"
filename_prefix = "conbira"

[database]
# Set CONBIRA_DATABASE__URL in .env or the environment.
url = ""
max_connections = 8

[cache]
# Set CONBIRA_CACHE__URL in .env or the environment.
url = ""
max_connections = 8
connect_timeout_ms = 1000
response_timeout_ms = 1000
pool_wait_timeout_ms = 200

[http]
bind_addr = "127.0.0.1:18080"

[argon2]
memory_kib = 19456
iterations = 2
parallelism = 1
output_len = 32

[auth.refresh_token]
ttl_seconds = 604800
absolute_ttl_seconds = 2592000

[auth.password_hash]
max_concurrency = 4
wait_timeout_seconds = 5

[jwt]
issuer = "conbira"
audience = "conbira"
access_token_ttl_seconds = 900

[jwt.ed25519]
key_path = "var/jwt/private.pem"
public_key_path = "var/jwt/public.pem"

[file_asset]
max_size_bytes = 5368709120
upload_url_ttl_secs = 600
download_url_ttl_secs = 180

[file_asset.s3]
# Set CONBIRA_FILE_ASSET__S3__ACCESS_KEY_ID and CONBIRA_FILE_ASSET__S3__SECRET_ACCESS_KEY.
access_key_id = ""
secret_access_key = ""
bucket = "conbirafiles"
region = "us-east-1"
key_prefix = "uploads"
endpoint = "http://192.168.1.20:19000"
