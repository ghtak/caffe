[package]
name = "conbira"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "conbira"
path = "src/main.rs"

[[bin]]
name = "conbira-cli"
path = "src/cli/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
axum = "0.8.9"
clap = { version = "4", features = ["derive"] }
jiff = { version = "0.2", features = ["serde"] }
jiff-sqlx = { version = "0.2", features = ["postgres"] }
dotenvy = "0.15"
espr = { path = "../espr" }
espr-derive = { path = "../espr-derive" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
rand_core = { version = "0.6", features = ["getrandom", "std"] }
sha2 = "0.10"
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "uuid"] }
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
async-trait = "0.1.92"

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
