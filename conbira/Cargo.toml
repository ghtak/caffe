[package]
name = "conbira"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "conbira"
path = "src/main.rs"

[[bin]]
name = "conbira-cli"
path = "src/cli/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8.9"
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
dotenvy = "0.15"
espr = { path = "../espr" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9.0", features = ["chrono", "postgres", "runtime-tokio"] }
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
