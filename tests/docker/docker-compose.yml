services:
  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "valkey-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 12

  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    configs:
      - source: postgres_init
        target: /docker-entrypoint-initdb.d/00-create-databases.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d conbira_dev" ]
      interval: 5s
      timeout: 5s
      retries: 12

  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    ports:
      - "19000:9000" # S3 API 통신용 포트
      - "19001:9001" # 웹 관리자 콘솔 접속용 포트
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfspasswd
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_VOLUMES: "/data"
    volumes:
      - rustfs_data:/data # 도커 볼륨 연결 (데이터 영구 보존)

volumes:
  postgres_data:
  rustfs_data:

configs:
  postgres_init:
    content: |
      CREATE DATABASE conbira;
      CREATE DATABASE conbira_dev;
      CREATE DATABASE conbira_test;
      CREATE DATABASE espr_test;
